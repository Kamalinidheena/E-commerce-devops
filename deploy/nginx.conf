# Nginx Reverse-Proxy Configuration for IncidentPulse
# Deploy to /etc/nginx/sites-available/incidentpulse
# Symlink to /etc/nginx/sites-enabled/incidentpulse

upstream incidentpulse_backend {
    server 127.0.0.1:5000 fail_timeout=0;
}

server {
    listen 80;
    server_name your-domain.com; # Replace with your public domain or public IP

    # Redirect HTTP to HTTPS in production
    # return 301 https://$host$request_uri;

    client_max_body_size 5M;
    keepalive_timeout 65;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml image/svg+xml;

    # Static Assets Direct Serving
    location /static/ {
        alias /var/www/incidentpulse/incidentpulse/static/;
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    # Application Proxy
    location / {
        proxy_pass http://incidentpulse_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }
}
